name: islami
description: "A complete Islamic Flutter application."
publish_to: 'none'
version: 1.0.1+15

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.0
  shared_preferences: ^2.5.5
  connectivity_plus: ^7.3.1
  permission_handler: ^11.4.0
  just_audio: ^0.9.46
  flutter_local_notifications: ^17.2.4
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
