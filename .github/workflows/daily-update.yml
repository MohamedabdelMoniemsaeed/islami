name: Weekly Flutter Update

on:
  schedule:
    - cron: '0 3 * * 1'   # كل اسبوع يوم الاتنين 3 الفجر UTC
  workflow_dispatch:       # تشغيل يدوي وقت ما تحب

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show outdated packages
        run: flutter pub outdated

      - name: Upgrade packages
        run: flutter pub upgrade --major-versions

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build check
        run: flutter build apk --debug

      - name: Open Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/weekly-update
          title: "chore: weekly dependency update"
          commit-message: "chore: update dependencies"
          body: "تحديث أسبوعي تلقائي للحزم. تم فحص المشروع (analyze + test + build) بنجاح."