name: Flutter Maintenance - Safe Updates and Major Upgrades

on:
  schedule:
    - cron: "0 7 * * 5" # Friday 09:00 Egypt time (UTC+2) = 07:00 UTC
  workflow_dispatch:
    inputs:
      update_track:
        description: "Select the dependency update track"
        required: true
        type: choice
        default: safe
        options:
          - safe
          - major

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: flutter-maintenance-${{ github.workflow }}-${{ inputs.update_track || 'safe' }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      HAS_GEMINI: ${{ secrets.AI != '' }}
      HAS_CLAUDE: ${{ secrets.ANTHROPIC_API_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Confirm project root
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          pwd
          ls -la
          test -f "$GITHUB_WORKSPACE/pubspec.yaml" || { echo "::error::pubspec.yaml not found in repo root"; exit 1; }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-pub-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Safe dependency upgrade
        if: github.event_name != 'workflow_dispatch' || inputs.update_track == 'safe'
        run: |
          cd "$GITHUB_WORKSPACE"
          flutter pub upgrade

      - name: Major dependency upgrade
        if: github.event_name == 'workflow_dispatch' && inputs.update_track == 'major'
        run: |
          cd "$GITHUB_WORKSPACE"
          flutter pub upgrade --major-versions

      - name: Check dependency resolution
        run: |
          cd "$GITHUB_WORKSPACE"
          flutter pub get

      - name: Format Dart source before analysis
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -d lib ]; then dart format lib; fi
          if [ -d test ]; then dart format test; fi

      - name: Analyze before AI repair
        id: analyze_before
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          flutter analyze --no-fatal-infos

      - name: Install Gemini CLI
        if: steps.analyze_before.outcome == 'failure' && env.HAS_GEMINI == 'true'
        run: npm install --global @google/gemini-cli

      - name: Repair with Gemini
        if: steps.analyze_before.outcome == 'failure' && env.HAS_GEMINI == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.AI }}
        run: |
          cd "$GITHUB_WORKSPACE"
          for i in 1 2 3; do
            echo "Gemini repair attempt $i"

            if flutter analyze --no-fatal-infos; then
              break
            fi

            flutter analyze --no-fatal-infos > "$RUNNER_TEMP/flutter-analyze.txt" 2>&1 || true
            export REPAIR_PROMPT="Fix the Flutter/Dart analysis errors in lib/ and test/ using the current dependency APIs. Read the errors in $RUNNER_TEMP/flutter-analyze.txt. Preserve existing behavior and do not change pubspec.yaml or pubspec.lock. Keep the fix minimal."

            gemini --yolo -p "$REPAIR_PROMPT" || true

            if flutter analyze --no-fatal-infos; then
              break
            fi
          done

      - name: Final dependency verification
        id: deps
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          flutter pub get --offline

      - name: Final formatting check
        id: format
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -d lib ]; then dart format --output=none --set-exit-if-changed lib; fi
          if [ -d test ]; then dart format --output=none --set-exit-if-changed test; fi

      - name: Final analysis
        id: analyze
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          flutter analyze --no-fatal-infos

      - name: Tests
        id: tests
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -d test ]; then
            flutter test
          else
            echo "::error::No test/ directory found. Add automated tests."
            exit 1
          fi

      - name: Debug APK build
        id: build
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          flutter build apk --debug

      - name: Determine status
        id: status
        if: always()
        env:
          DEPS: ${{ steps.deps.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          if [ "$DEPS" = "success" ] &&
             [ "$FORMAT" = "success" ] &&
             [ "$ANALYZE" = "success" ] &&
             [ "$TESTS" = "success" ] &&
             [ "$BUILD" = "success" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes to default branch
        if: always() && steps.status.outputs.proceed == 'true'
        env:
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update Flutter dependencies and repair code" || true
            git push origin HEAD:${GITHUB_BRANCH}
          fi