<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" font-family="Segoe UI, Tahoma, Arial">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a9a5b"/>
    </marker>
  </defs>
  <rect width="940" height="420" fill="#f7f8f2"/>

  <!-- triggers -->
  <g font-size="13" text-anchor="middle">
    <rect x="20" y="70" width="170" height="42" rx="10" fill="#fff" stroke="#8a9a5b" stroke-width="1.6"/>
    <text x="105" y="96" fill="#2d3319">عند الإقلاع (main.dart)</text>
    <rect x="20" y="130" width="170" height="42" rx="10" fill="#fff" stroke="#8a9a5b" stroke-width="1.6"/>
    <text x="105" y="156" fill="#2d3319">فتح توقيت الصلاة</text>
    <rect x="20" y="190" width="170" height="42" rx="10" fill="#fdf6e3" stroke="#d4a017" stroke-width="1.6"/>
    <text x="105" y="216" fill="#2d3319">تغيير الإعدادات</text>
  </g>

  <!-- getPrayerTimes -->
  <rect x="250" y="128" width="180" height="66" rx="12" fill="#e8ecdb" stroke="#8a9a5b" stroke-width="2"/>
  <text x="340" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d3319">getPrayerTimes()</text>
  <text x="340" y="175" text-anchor="middle" font-size="12" fill="#4b5320">HTTPS · timeout 30s · كاش</text>

  <!-- gate -->
  <rect x="490" y="128" width="190" height="66" rx="12" fill="#e8ecdb" stroke="#8a9a5b" stroke-width="2"/>
  <text x="585" y="153" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d3319">getEnabledPrayers()</text>
  <text x="585" y="173" text-anchor="middle" font-size="12" fill="#4b5320">الرئيسي ∩ كل صلاة</text>

  <!-- ON lane: zonedSchedule -->
  <rect x="740" y="90" width="180" height="104" rx="12" fill="#eaf3df" stroke="#4b7d24" stroke-width="2"/>
  <text x="830" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d3319">zonedSchedule</text>
  <text x="830" y="140" text-anchor="middle" font-size="12" fill="#4b5320">ids 0–4 · exact</text>
  <text x="830" y="160" text-anchor="middle" font-size="12" fill="#4b5320">صوت @raw/azan (R8-pinned)</text>
  <text x="830" y="180" text-anchor="middle" font-size="11" fill="#4b7d24">إشعار "حان الآن موعد …"</text>

  <!-- OFF lane: cancelAll -->
  <rect x="740" y="240" width="180" height="60" rx="12" fill="#fdeaea" stroke="#b23b3b" stroke-width="2"/>
  <text x="830" y="266" text-anchor="middle" font-size="14" font-weight="bold" fill="#5c1f1f">cancelAll()</text>
  <text x="830" y="284" text-anchor="middle" font-size="12" fill="#8a3333">الرئيسي معطّل / إيقاف صلاة</text>

  <!-- arrows: triggers -> times -->
  <g stroke="#8a9a5b" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <line x1="190" y1="91" x2="246" y2="143"/>
    <line x1="190" y1="151" x2="246" y2="160"/>
    <line x1="190" y1="211" x2="246" y2="178"/>
  </g>

  <!-- times -> gate : animated dashed flow -->
  <line x1="430" y1="161" x2="486" y2="161" stroke="#4b7d24" stroke-width="2.4" stroke-dasharray="7 7" marker-end="url(#ar)">
    <animate attributeName="stroke-dashoffset" from="28" to="0" dur="0.9s" repeatCount="indefinite"/>
  </line>

  <!-- gate -> ON lane -->
  <line x1="680" y1="150" x2="736" y2="135" stroke="#4b7d24" stroke-width="2.2" stroke-dasharray="7 7" marker-end="url(#ar)">
    <animate attributeName="stroke-dashoffset" from="28" to="0" dur="0.9s" repeatCount="indefinite"/>
  </line>
  <text x="700" y="130" font-size="12" fill="#4b7d24" font-weight="bold">الرئيسي شغال</text>

  <!-- gate -> OFF lane -->
  <line x1="680" y1="180" x2="736" y2="262" stroke="#b23b3b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="700" y="238" font-size="12" fill="#b23b3b" font-weight="bold">معطّل</text>

  <!-- bottom note -->
  <rect x="250" y="330" width="430" height="60" rx="10" fill="#fff" stroke="#8a9a5b" stroke-width="1.4"/>
  <text x="465" y="355" text-anchor="middle" font-size="13" fill="#2d3319">الإشعارات exact (SCHEDULE_EXACT_ALARM) — ids ثابتة لكل صلاة</text>
  <text x="465" y="375" text-anchor="middle" font-size="12" fill="#4b5320">إعادة الجدولة = استبدال (مش تراكم) · الإشعارات بتتحذف لو وقتها فات</text>

  <!-- pulsing bell on the ON lane -->
  <g transform="translate(740, 82)">
    <circle cx="8" cy="8" r="8" fill="#d4a017">
      <animate attributeName="r" values="8;12;8" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="8" y="12" text-anchor="middle" font-size="9" fill="#fff">!</text>
  </g>
</svg>
