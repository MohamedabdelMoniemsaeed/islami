<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="Segoe UI, Tahoma, Arial">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a9a5b"/>
    </marker>
  </defs>
  <rect width="940" height="400" fill="#f7f8f2"/>

  <!-- APIs column -->
  <g font-size="13" text-anchor="middle">
    <rect x="20" y="50" width="210" height="46" rx="10" fill="#fff" stroke="#8a9a5b" stroke-width="1.6"/>
    <text x="125" y="71" fill="#2d3319" font-weight="bold">quran.yousefheiba.com</text>
    <text x="125" y="88" font-size="11" fill="#4b5320">مواقيت · أذكار · أدعية · تلاوات · تفسير</text>
    <rect x="20" y="116" width="210" height="46" rx="10" fill="#fff" stroke="#8a9a5b" stroke-width="1.6"/>
    <text x="125" y="137" fill="#2d3319" font-weight="bold">api.alquran.cloud</text>
    <text x="125" y="154" font-size="11" fill="#4b5320">نص السور</text>
    <rect x="20" y="182" width="210" height="46" rx="10" fill="#fff" stroke="#8a9a5b" stroke-width="1.6"/>
    <text x="125" y="203" fill="#2d3319" font-weight="bold">hadis-api-id.vercel.app</text>
    <text x="125" y="220" font-size="11" fill="#4b5320">أحاديث</text>
    <text x="125" y="252" font-size="12" fill="#4b7d24" font-weight="bold">كلها HTTPS (مفيش cleartext)</text>
  </g>

  <!-- ApiService -->
  <rect x="310" y="100" width="190" height="100" rx="12" fill="#e8ecdb" stroke="#8a9a5b" stroke-width="2"/>
  <text x="405" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2d3319">ApiService</text>
  <text x="405" y="155" text-anchor="middle" font-size="12" fill="#4b5320">http.get · timeout 30s</text>
  <text x="405" y="175" text-anchor="middle" font-size="12" fill="#4b5320">catch → fallback للكاش</text>

  <!-- cache -->
  <rect x="310" y="250" width="190" height="80" rx="12" fill="#fff" stroke="#d4a017" stroke-width="2"/>
  <text x="405" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d3319">CacheService</text>
  <text x="405" y="300" text-anchor="middle" font-size="12" fill="#4b5320">SharedPreferences (offline)</text>
  <text x="405" y="318" text-anchor="middle" font-size="11" fill="#8a6d1f">كاش تالف → evict (removeData)</text>

  <!-- screens -->
  <rect x="590" y="80" width="200" height="140" rx="12" fill="#eaf3df" stroke="#4b7d24" stroke-width="2"/>
  <text x="690" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d3319">الشاشات</text>
  <text x="690" y="135" text-anchor="middle" font-size="12" fill="#4b5320">فutures ثابتة في initState</text>
  <text x="690" y="155" text-anchor="middle" font-size="12" fill="#4b5320">(مش إعادة جلب مع كل rebuild)</text>
  <text x="690" y="180" text-anchor="middle" font-size="12" fill="#4b5320">hasError → رسالة عربية واضحة</text>

  <!-- radios/just_audio -->
  <rect x="590" y="250" width="200" height="80" rx="12" fill="#fff" stroke="#8a9a5b" stroke-width="1.6"/>
  <text x="690" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d3319">إذاعات / تلاوات</text>
  <text x="690" y="303" text-anchor="middle" font-size="12" fill="#4b5320">just_audio · روابط https بس</text>

  <!-- arrows APIs -> service (animated) -->
  <g stroke="#4b7d24" stroke-width="2.2" stroke-dasharray="7 7" fill="none" marker-end="url(#ar2)">
    <line x1="230" y1="73" x2="306" y2="120">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="230" y1="139" x2="306" y2="148">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="230" y1="205" x2="306" y2="176">
      <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1s" begin="0.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- service -> cache (write + read) -->
  <line x1="405" y1="200" x2="405" y2="246" stroke="#d4a017" stroke-width="2.2" stroke-dasharray="6 6" marker-end="url(#ar2)">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <text x="416" y="228" font-size="11" fill="#8a6d1f">حفظ / استرجاع</text>

  <!-- service -> screens (animated) -->
  <line x1="500" y1="130" x2="586" y2="120" stroke="#4b7d24" stroke-width="2.4" stroke-dasharray="7 7" marker-end="url(#ar2)">
    <animate attributeName="stroke-dashoffset" from="28" to="0" dur="0.9s" repeatCount="indefinite"/>
  </line>
  <text x="520" y="105" font-size="12" fill="#4b7d24" font-weight="bold">success</text>

  <!-- cache -> screens (offline path, animated slower) -->
  <path d="M 500 290 L 560 290 L 560 196 L 586 188" stroke="#d4a017" stroke-width="2" stroke-dasharray="5 8" fill="none" marker-end="url(#ar2)">
    <animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <text x="540" y="310" font-size="12" fill="#8a6d1f">offline</text>

  <!-- service -> audio -->
  <line x1="500" y1="185" x2="586" y2="282" stroke="#8a9a5b" stroke-width="1.8" fill="none" marker-end="url(#ar2)"/>
  <text x="520" y="246" font-size="12" fill="#4b5320">audio_url (فحص https)</text>
</svg>
